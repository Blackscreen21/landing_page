<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warenkorb Ticketshop Prototype</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="cart">

<header class="site-header">
  <a class="logo" href="index.html" aria-label="ÖBB Ticketshop">ÖBB</a>
  <nav aria-label="Hauptnavigation">
    <button type="button" class="account" id="login-btn">
      <span class="avatar" aria-hidden="true">👤</span>
      <span><strong data-i18n="account">Mein Konto</strong><small data-i18n="logged_out">Nicht angemeldet</small></span>
    </button>
    <a href="products.html" data-i18n="nav_products">Alle Produkte</a>
    <a href="cart.html" data-i18n="nav_cart">Warenkorb</a>
    <a href="tickets.html" data-i18n="nav_tickets">Meine Tickets</a>
    <div class="lang" role="group" aria-label="Sprache">
      <button type="button" data-lang="de" aria-pressed="true">DE</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </nav>
</header>

<main class="subpage">
  <section class="card">
    <h1 data-i18n="cart_h">Warenkorb</h1>
    <p id="cart-empty" data-i18n="cart_empty" hidden>Dein Warenkorb ist leer.</p>
    <ul class="products" id="cart-list"></ul>
    <div id="cart-summary" hidden>
      <div class="total"><span data-i18n="total">Gesamt</span><span id="cart-total"></span></div>
      <button type="button" class="primary" id="checkout-btn" data-i18n="checkout">Zur Kasse</button>
    </div>
    <div id="confirm" class="notice" hidden>
      <strong data-i18n="confirm_h">Bestellung prüfen</strong>
      <p data-i18n="confirm_text">Prototype: Es erfolgt keine echte Zahlung.</p>
      <button type="button" class="primary" id="confirm-btn" data-i18n="confirm">Kauf bestätigen</button>
    </div>
    <div class="actions">
      <a class="soft" href="products.html" data-i18n="to_products">Zu den Produkten</a>
    </div>
  </section>
  <button type="button" class="link" id="reset-consent" data-i18n="cookie_settings">Cookie-Einstellungen ändern</button>
</main>

<div id="banner" class="cookie-banner" role="dialog" aria-label="Cookie-Einwilligung" aria-describedby="consent_text">
  <p id="consent_text" data-i18n="consent_text"></p>
  <div class="cookie-actions">
    <button type="button" id="decline" data-i18n="decline">Ablehnen</button>
    <button type="button" id="accept" data-i18n="accept">Zustimmen</button>
  </div>
</div>

<script src="common.js"></script>
<script src="pages.js"></script>
</body>
</html>
